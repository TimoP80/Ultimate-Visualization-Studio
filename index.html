<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: asset: http://asset.localhost; media-src 'self' blob: asset: http://asset.localhost; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ipc: http://ipc.localhost" />
    <title>Ultimate Visualization Studio</title>
    <!-- Critical styles: the splash must look finished before any bundle loads. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 42%, #12161d 0%, #08090b 62%);
        color: #e8ebf0;
        font-family: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;
        transition: opacity 340ms ease;
      }
      #splash .splash-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 24px;
      }
      #splash .splash-mark {
        width: 64px;
        height: 64px;
        filter: drop-shadow(0 0 18px rgba(34, 211, 238, 0.28));
        animation: splash-turn 14s linear infinite;
      }
      #splash .splash-copy {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      #splash .splash-title {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.01em;
        line-height: 1.2;
      }
      #splash .splash-sub {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #6d7684;
      }
      #splash .splash-bar {
        width: 132px;
        height: 2px;
        margin-top: 4px;
        border-radius: 2px;
        background: #1b1f25;
        overflow: hidden;
      }
      #splash .splash-bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, #22d3ee, #8b5cf6);
        animation: splash-sweep 1.1s ease-in-out infinite;
      }
      #splash.splash--exit {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes splash-turn {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes splash-sweep {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(290%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash-mark,
        #splash .splash-bar span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" role="status" aria-label="Starting Ultimate Visualization Studio">
      <div class="splash-card">
        <svg class="splash-mark" viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <linearGradient id="splashGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#22d3ee" />
              <stop offset="100%" stop-color="#8b5cf6" />
            </linearGradient>
          </defs>
          <circle cx="16" cy="16" r="13.5" fill="none" stroke="url(#splashGrad)" stroke-width="1.4" />
          <circle cx="16" cy="16" r="7.5" fill="none" stroke="#8b5cf6" stroke-width="1.1" opacity="0.7" />
          <path d="M16 6.5v19M8.2 11.2l15.6 9.6M8.2 20.8l15.6-9.6" stroke="url(#splashGrad)" stroke-width="1" opacity="0.55" />
          <circle cx="16" cy="16" r="2.4" fill="#22d3ee" />
        </svg>
        <div class="splash-copy">
          <span class="splash-title">Ultimate Visualization Studio</span>
          <span class="splash-sub">Audio · Motion · Video</span>
        </div>
        <div class="splash-bar" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
